name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all mod variants
        run: ./gradlew build -q
        working-directory: client-mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Build legacy Forge 1.12.2 mod
        run: ./gradlew build -q
        working-directory: client-mod/legacy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Build mc26 mod variants
        run: ./gradlew build -q
        working-directory: client-mod/mc26

      - name: Collect mod JARs
        run: |
          mkdir -p release-artifacts
          for dir in client-mod/version-*/build/libs; do
            cp "$dir"/mct-client-mod-*.jar release-artifacts/ 2>/dev/null || true
          done
          for dir in client-mod/mc26/version-*/build/libs; do
            cp "$dir"/mct-client-mod-*.jar release-artifacts/ 2>/dev/null || true
          done
          for dir in client-mod/legacy/version-*/build/libs; do
            cp "$dir"/mct-client-mod-*.jar release-artifacts/ 2>/dev/null || true
          done
          ls -la release-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: release-artifacts/*.jar

  build-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:cli

      - name: Smoke-test packed CLI installation
        env:
          MCT_HOME: ${{ runner.temp }}/mct-install-home
          MCT_SKILL_TARGETS: none
        run: |
          package_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          npm pack --workspace cli --pack-destination "$package_dir"
          npm install --global --prefix "$install_dir" "$package_dir"/*.tgz --no-audit --no-fund
          "$install_dir/bin/mct" --cli-version

  publish-github-release:
    needs: [build-mod, build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          generate_release_notes: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify the published release serves this CLI's mod jars
        run: |
          npm ci
          npm run build
          node scripts/check-release-mod-download.mjs

  publish-npm:
    needs: [build-mod, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm run build

      # Trusted publishing (OIDC): no NPM_TOKEN needed
      - name: Publish to npm
        run: npm publish --workspace cli --access public
