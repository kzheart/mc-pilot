name: Mod download regression

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recording:
    name: Native recording / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Provide the trusted distro FFmpeg encoder
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
      - name: Shared recorder lifecycle, ownership, CFR and actual MP4 decoding
        run: sh client-mod/tests/recording/run-tests.sh
      - name: Bounded GPU/PBO adapter lifecycle regressions
        run: bash client-mod/tests/run-recording-adapter-tests.sh
      - name: Exact legacy framebuffer transformer regressions
        shell: bash
        run: |
          asm="$RUNNER_TEMP/asm-debug-all-5.2.jar"
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/ow2/asm/asm-debug-all/5.2/asm-debug-all-5.2.jar -o "$asm"
          echo "254b82bec9da4f8efbc8b1f93ab2b87f7465227a82b36cf3d05d9e77a0e8dd2e  $asm" | sha256sum -c -
          MCT_TEST_ASM_JAR="$asm" bash client-mod/tests/run-recording-transformer-tests.sh
  game-audio:
    name: Native OpenAL game-audio adapter / Java 17
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned official LWJGL test dependencies
        shell: bash
        run: |
          libs="$RUNNER_TEMP/mct-openal-test-libs"
          mkdir -p "$libs"
          for module in lwjgl lwjgl-openal; do
            for classifier in '' '-natives-linux'; do
              file="$module-3.3.1$classifier.jar"
              curl -fsSL --retry 3 "https://repo.maven.apache.org/maven2/org/lwjgl/$module/3.3.1/$file" -o "$libs/$file"
            done
          done
          cd "$libs"
          sha256sum -c <<'HASHES'
          cf83f90e32fb973ff5edfca4ef35f55ca51bb70a579b6a1f290744f552e8e484  lwjgl-3.3.1.jar
          22ef2afa31a1740a337ec9c6806c6b8d97e931a63e2c43270cbaf14fb3f6fc4e  lwjgl-3.3.1-natives-linux.jar
          7325ee1b91a8a10c0626c69b557a88f2df6ac1bdca0e52e2a92d324249f2cad0  lwjgl-openal-3.3.1.jar
          0b7381f51edc610cb607245dc34a762d2b21b7447814044068a1a6003bb87838  lwjgl-openal-3.3.1-natives-linux.jar
          HASHES
          echo "MCT_TEST_LWJGL_DIR=$libs" >> "$GITHUB_ENV"
      - name: Real loopback, context ownership, timing and bounded shutdown
        run: sh client-mod/tests/game-audio/run-tests.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check protocol packaging and handler families
        run: npm run check:protocol && npm run test:protocol
      - run: npm run build
      - name: Catalog, schema, and process ownership regressions
        run: node --test cli/dist/download/ModVariantCatalog.test.js cli/dist/download/VersionMatrix.test.js cli/dist/protocol-schema.test.js cli/dist/instance/client-process-ownership.test.js
      - name: WebSocket transport regressions
        run: node --test cli/dist/client/WebSocketClient.test.js
      - name: Recording CLI and launch configuration regressions
        run: node --test cli/dist/record-cli.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: echo "MCT_TEST_JAVA25_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: echo "MCT_TEST_JAVA8_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Shared main-thread command queue regressions
        run: |
          sh client-mod/tests/run-client-task-tests.sh
          sh client-mod/tests/run-connection-request-tests.sh
          sh client-mod/tests/run-temporary-input-tests.sh
          sh client-mod/tests/run-async-resource-tests.sh
      - name: Resource-pack contracts and connect hooks
        run: |
          sh client-mod/legacy/tests/run-resourcepack-tests.sh
          python3 client-mod/tests/check-resourcepack-connect-hooks.py
          JAVA_HOME="$MCT_TEST_JAVA25_HOME" sh client-mod/tests/run-pack-metadata-tests.sh
      - name: Vanilla interaction feedback and all-variant routing regressions
        run: JAVA="$MCT_TEST_JAVA25_HOME/bin/java" JAVAC="$MCT_TEST_JAVA25_HOME/bin/javac" python3 client-mod/tests/interaction-feedback/run-tests.py
      - name: Exact native WebSocket wrapper regressions
        shell: bash
        run: |
          libs="$RUNNER_TEMP/mct-websocket-test-libs"
          mkdir -p "$libs"
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/java-websocket/Java-WebSocket/1.5.6/Java-WebSocket-1.5.6.jar -o "$libs/websocket.jar"
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar -o "$libs/gson.jar"
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/org/slf4j/slf4j-api/2.0.9/slf4j-api-2.0.9.jar -o "$libs/slf4j.jar"
          curl -fsSL --retry 3 https://repo.maven.apache.org/maven2/com/google/guava/guava/21.0/guava-21.0.jar -o "$libs/guava.jar"
          MCT_TEST_GUAVA_JAR="$libs/guava.jar" sh client-mod/tests/run-legacy-reconnect-tests.sh
          JAVA_HOME="$MCT_TEST_JAVA25_HOME" MCT_TEST_GUAVA_JAR="$libs/guava.jar" sh client-mod/tests/run-legacy-reconnect-tests.sh
          MCT_TEST_WEBSOCKET_JAR="$libs/websocket.jar" MCT_TEST_GSON_JAR="$libs/gson.jar" MCT_TEST_SLF4J_JAR="$libs/slf4j.jar" bash client-mod/tests/run-websocket-regression-tests.sh
      - name: Download regression tests
        run: node --test cli/dist/download/client/ModRelease.test.js cli/dist/download/client/ClientDownloader.test.js
      - name: GUI input and proxy topology regressions
        working-directory: cli
        run: |
          node --test dist/instance/server-flavor.test.js dist/instance/proxy-check.test.js
          node --test --test-name-pattern='GUI number key' dist/command-matrix.test.js
      - name: Download every default mod jar of this CLI release from an empty cache
        run: node scripts/check-release-mod-download.mjs --allow-unpublished
